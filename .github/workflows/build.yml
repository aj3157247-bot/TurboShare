name: TurboShare Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Show project structure
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== App files ==="
          ls -la app
          echo "=== App build.gradle.kts ==="
          cat app/build.gradle.kts
          echo "=== Root build.gradle.kts ==="
          cat build.gradle.kts
          echo "=== Settings ==="
          cat settings.gradle.kts

      - name: Check Gradle projects
        run: gradle projects --no-daemon --stacktrace

      - name: Check Android tasks
        run: gradle :app:tasks --all --no-daemon --stacktrace

      - name: Build TurboShare APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --refresh-dependencies

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboShare-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
