name: TurboShare Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TurboShare APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Generated APK:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboShare-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
