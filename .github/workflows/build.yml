name: TurboShare Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TurboShare APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clean build
        run: gradle clean --no-daemon --stacktrace

      - name: Build signed Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          echo "Generated APK:"
          find app/build/outputs/apk/debug -type f -name "*.apk" -print
          test -n "$(find app/build/outputs/apk/debug -type f -name "*.apk" -print -quit)"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboShare-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
