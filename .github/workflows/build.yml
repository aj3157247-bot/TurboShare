name: TurboShare Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 👇 اضافه کردن این بخش برای اینکه گیت‌هاب بداند وارد کدام پوشه شود
    defaults:
      run:
        working-directory: ./turboshare

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        
    - name: Install Dependencies
      run: flutter pub get
      
    - name: Build Android APK
      run: flutter build apk --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TurboShare-Release-APK
        # 👇 مسیر دریافت فایل خروجی هم باید آپدیت شود
        path: turboshare/build/app/outputs/flutter-apk/app-release.apk
